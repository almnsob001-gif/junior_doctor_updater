name: Build Release AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        pip install --upgrade buildozer "cython<3"

    # 1. استخراج المفتاح السري وتحويله إلى ملف
    - name: Create Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

    # 2. بناء نسخة AAB الموقعة (تمرير كلمة المرور والاسم)
    - name: Build Release AAB
      env:
        keystore_alias: ${{ secrets.KEYSTORE_ALIAS }}
        keystore_password: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        buildozer -v android release

    # 3. رفع ملف AAB الناتج
    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: JuniorDoctor-Release-AAB
        path: bin/*.aab
